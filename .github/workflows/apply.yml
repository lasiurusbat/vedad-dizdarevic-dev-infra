name: Apply

on:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - '.github/workflows/apply.yml'
  workflow_dispatch:
    inputs:
      allow_destroy:
        description: 'Allow a plan that deletes or replaces resources (review the plan first)'
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # OIDC to AWS, no stored keys

# One apply at a time, and never cancel one that is running: a cancelled apply can leave
# state locked and resources half-created. Newer pushes wait their turn.
concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The apply role trusts this environment's OIDC subject (and refs/heads/main).
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_site_bucket_name: vdd-site-${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_app_repo: vedad-dizdarevic-dev-app
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_dmarc_rua_email: ${{ vars.DMARC_RUA_EMAIL }}
      TF_VAR_purelymail_ownership_proof: ${{ vars.PURELYMAIL_OWNERSHIP_PROOF }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version_file: .terraform-version
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: init
        working-directory: main
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: plan
        working-directory: main
        run: terraform plan -input=false -no-color -lock-timeout=60s -out=tfplan | tee "$RUNNER_TEMP/plan.txt"

      # A missing CI variable can make Terraform want to replace things. Refuse to apply a plan
      # that deletes or replaces anything unless a person re-runs the workflow with allow_destroy.
      - name: refuse destructive plans
        working-directory: main
        env:
          ALLOW_DESTROY: ${{ inputs.allow_destroy }}
        run: |
          terraform show -json tfplan > "$RUNNER_TEMP/plan.json"
          jq -r '.resource_changes[]? | select(.change.actions | index("delete")) | "\(.change.actions | join("+")) \(.address)"' "$RUNNER_TEMP/plan.json" > "$RUNNER_TEMP/destroys.txt"
          count=$(wc -l < "$RUNNER_TEMP/destroys.txt")
          echo "resources to delete or replace: $count"
          if [ "$count" -gt 0 ]; then
            cat "$RUNNER_TEMP/destroys.txt"
            if [ "$ALLOW_DESTROY" != "true" ]; then
              echo "::error::The plan deletes or replaces $count resource(s). Review it, then re-run with allow_destroy=true."
              exit 1
            fi
          fi

      - name: apply
        working-directory: main
        run: terraform apply -input=false -no-color -lock-timeout=60s tfplan | tee "$RUNNER_TEMP/apply.txt"
      - name: summary
        if: always()
        run: |
          {
            echo '### terraform apply (main)'
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/apply.txt" 2>/dev/null || tail -c 60000 "$RUNNER_TEMP/plan.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
