name: Plan

on:
  pull_request:
    paths:
      - 'main/**'
      - '.github/workflows/plan.yml'

permissions:
  contents: read
  id-token: write # OIDC to AWS, no stored keys
  pull-requests: write # sticky plan comment

# bash with pipefail (-eo pipefail): without it, `terraform ... | tee` reports tee's exit code and a
# failed plan or apply looks like a success.
defaults:
  run:
    shell: bash

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_site_bucket_name: vdd-site-${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_app_repo: vedad-dizdarevic-dev-app
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_dmarc_rua_email: ${{ vars.DMARC_RUA_EMAIL }}
      TF_VAR_purelymail_ownership_proof: ${{ vars.PURELYMAIL_OWNERSHIP_PROOF }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version_file: .terraform-version
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      - name: init
        working-directory: main
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: plan
        working-directory: main
        run: terraform plan -input=false -no-color -lock-timeout=60s | tee "$RUNNER_TEMP/plan.txt"
      - name: summary
        if: always()
        run: |
          {
            echo '### terraform plan (main)'
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/plan.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: comment on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- terraform-plan -->'
          {
            echo "$marker"
            echo '### terraform plan (main)'
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/plan.txt" 2>/dev/null
            echo '```'
          } > "$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            -q ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@"$RUNNER_TEMP/comment.md" > /dev/null
          fi
