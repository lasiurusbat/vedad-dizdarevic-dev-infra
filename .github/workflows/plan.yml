name: Plan

on:
  pull_request:
    paths:
      - 'main/**'
      - '.github/workflows/plan.yml'

permissions:
  contents: read
  id-token: write # OIDC to AWS, no stored keys

concurrency:
  group: plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_site_bucket_name: vdd-site-${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_github_org: ${{ github.repository_owner }}
      TF_VAR_app_repo: vedad-dizdarevic-dev-app
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
      TF_VAR_dmarc_rua_email: ${{ vars.DMARC_RUA_EMAIL }}
      TF_VAR_purelymail_ownership_proof: ${{ vars.PURELYMAIL_OWNERSHIP_PROOF }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version_file: .terraform-version
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-central-1
      - name: init
        working-directory: main
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
      - name: plan
        working-directory: main
        run: terraform plan -input=false -no-color -lock-timeout=60s | tee "$RUNNER_TEMP/plan.txt"
      - name: summary
        if: always()
        run: |
          {
            echo '### terraform plan (main)'
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/plan.txt" 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
