version: 2

updates:
  # Provider versions in the two root modules (and their lock files).
  - package-ecosystem: terraform
    directories:
      - /bootstrap
      - /main
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types: [minor, patch]
